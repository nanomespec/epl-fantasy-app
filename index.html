<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EPL Fantasy Mini App</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col h-screen overflow-hidden select-none bg-[#17212b] text-white">

  <!-- TOP HEADER BAR -->
  <header class="bg-[#242f3d] p-3 flex justify-between items-center shadow-md border-b border-gray-700">
    <div>
      <h1 class="text-sm font-bold text-gray-200" id="team-name">Gulit FC</h1>
      <p class="text-xs text-blue-400 font-semibold">Gameweek 1 • Deadline: Oct 9, 15:00</p>
    </div>
    <div class="text-right">
      <span class="text-xs text-gray-400">Total Points</span>
      <p class="text-lg font-black text-green-400" id="total-points">0</p>
    </div>
  </header>

  <!-- TAB 1: PITCH / SQUAD VIEW -->
  <main id="tab-pitch" class="tab-content flex-1 pitch-bg m-2 rounded-xl p-2 flex flex-col justify-between relative overflow-y-auto">
    <div class="flex justify-center my-1" id="row-gkp"></div>
    <div class="flex justify-around my-1" id="row-def"></div>
    <div class="flex justify-around my-1" id="row-mid"></div>
    <div class="flex justify-around my-1" id="row-fwd"></div>

    <div class="bg-[#242f3d]/90 backdrop-blur-md p-2 rounded-lg border border-gray-600 mt-2">
      <p class="text-[10px] text-gray-400 uppercase font-bold text-center mb-1">Substitutes</p>
      <div class="flex justify-around" id="row-bench"></div>
    </div>
  </main>

  <!-- TAB 2: TRANSFERS / PLAYER MARKET -->
  <main id="tab-transfers" class="tab-content flex-1 p-3 overflow-y-auto hidden">
    <!-- Budget Summary -->
    <div class="bg-[#242f3d] p-3 rounded-lg border border-gray-700 flex justify-between mb-3 text-xs">
      <div>
        <span class="text-gray-400">Bank Balance:</span>
        <p class="text-sm font-bold text-green-400" id="bank-balance">100.0M ETB</p>
      </div>
      <div class="text-right">
        <span class="text-gray-400">Selected Players:</span>
        <p class="text-sm font-bold text-blue-400" id="squad-count">0 / 15</p>
      </div>
    </div>

    <!-- Filters -->
    <div class="flex gap-2 mb-3">
      <input type="text" id="search-input" oninput="renderTransfers()" placeholder="Search player..." class="bg-[#17212b] border border-gray-700 rounded p-2 text-xs flex-1 outline-none focus:border-blue-500">
      <select id="pos-filter" onchange="renderTransfers()" class="bg-[#17212b] border border-gray-700 rounded p-2 text-xs outline-none">
        <option value="ALL">All Positions</option>
        <option value="GKP">GKP</option>
        <option value="DEF">DEF</option>
        <option value="MID">MID</option>
        <option value="FWD">FWD</option>
      </select>
    </div>

    <!-- Player Market List -->
    <div id="transfer-market-list" class="space-y-2"></div>
  </main>

  <!-- TAB 3: LEAGUES & STANDINGS -->
  <main id="tab-leagues" class="tab-content flex-1 p-3 overflow-y-auto hidden">
    <h2 class="text-sm font-bold text-gray-300 mb-2">Global Leaderboard</h2>
    <div class="bg-[#242f3d] rounded-lg border border-gray-700 p-3 mb-4 space-y-2" id="leaderboard-list">
      <div class="flex justify-between items-center text-xs pb-2 border-b border-gray-700">
        <span class="font-bold text-blue-400">1. St. George Army</span>
        <span class="text-green-400 font-bold">142 pts</span>
      </div>
      <div class="flex justify-between items-center text-xs pb-2 border-b border-gray-700">
        <span class="font-bold text-gray-200">2. Gulit FC (You)</span>
        <span class="text-gray-300 font-bold">0 pts</span>
      </div>
    </div>

    <h2 class="text-sm font-bold text-gray-300 mb-2">Cash Leagues (Telebirr)</h2>
    <div class="bg-[#242f3d] rounded-lg border border-gray-700 p-3 flex justify-between items-center">
      <div>
        <p class="text-xs font-bold text-yellow-400">Gameweek 1 Sprint</p>
        <p class="text-[10px] text-gray-400">Entry: 50 ETB • Prize Pool: 20,000 ETB</p>
      </div>
      <button onclick="tg.showAlert('Telebirr payment integration coming for GW1!')" class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-1.5 rounded font-semibold">Join</button>
    </div>
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="bg-[#242f3d] border-t border-gray-700 flex justify-around py-2">
    <button onclick="switchTab('pitch')" id="nav-pitch" class="flex flex-col items-center text-blue-400">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm1 11H9v-2h2v2zm0-4H9V7h2v2z"/></svg>
      <span class="text-[10px] font-medium mt-1">Pitch</span>
    </button>
    <button onclick="switchTab('transfers')" id="nav-transfers" class="flex flex-col items-center text-gray-400">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M8 5a1 1 0 100 2h4a1 1 0 100-2H8zM6 9a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z"/></svg>
      <span class="text-[10px] font-medium mt-1">Transfers</span>
    </button>
    <button onclick="switchTab('leagues')" id="nav-leagues" class="flex flex-col items-center text-gray-400">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3z"/></svg>
      <span class="text-[10px] font-medium mt-1">Leagues</span>
    </button>
  </nav>

  <!-- JAVASCRIPT LOGIC -->
  <script src="app.js"></script>
</body>
</html>
