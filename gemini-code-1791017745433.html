<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EPL Fantasy Telegram Mini App</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col h-screen overflow-hidden select-none bg-[#17212b] text-white">

  <!-- TOP HEADER BAR -->
  <header class="bg-[#242f3d] p-3 flex justify-between items-center shadow-md border-b border-gray-700">
    <div>
      <h1 class="text-sm font-bold text-gray-200" id="team-name">Gulit FC</h1>
      <p class="text-xs text-blue-400 font-semibold">Gameweek 1 • Deadline: Oct 9, 15:00</p>
    </div>
    <div class="text-right">
      <span class="text-xs text-gray-400">Total Points</span>
      <p class="text-lg font-black text-green-400" id="total-points">0</p>
    </div>
  </header>

  <!-- MAIN PITCH VIEWPORT -->
  <main class="flex-1 pitch-bg m-2 rounded-xl p-2 flex flex-col justify-between relative overflow-y-auto">
    
    <!-- GKP ROW -->
    <div class="flex justify-center my-1" id="row-gkp"></div>

    <!-- DEF ROW -->
    <div class="flex justify-around my-1" id="row-def"></div>

    <!-- MID ROW -->
    <div class="flex justify-around my-1" id="row-mid"></div>

    <!-- FWD ROW -->
    <div class="flex justify-around my-1" id="row-fwd"></div>

    <!-- BENCH ZONE CONTAINER -->
    <div class="bg-[#242f3d]/90 backdrop-blur-md p-2 rounded-lg border border-gray-600 mt-2">
      <p class="text-[10px] text-gray-400 uppercase font-bold text-center mb-1">Substitutes</p>
      <div class="flex justify-around" id="row-bench"></div>
    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="bg-[#242f3d] border-t border-gray-700 flex justify-around py-2">
    <button class="flex flex-col items-center text-blue-400">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm1 11H9v-2h2v2zm0-4H9V7h2v2z"/></svg>
      <span class="text-[10px] font-medium mt-1">Pitch</span>
    </button>
    <button class="flex flex-col items-center text-gray-400 hover:text-gray-200">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M8 5a1 1 0 100 2h4a1 1 0 100-2H8zM6 9a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z"/></svg>
      <span class="text-[10px] font-medium mt-1">Transfers</span>
    </button>
    <button class="flex flex-col items-center text-gray-400 hover:text-gray-200">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3z"/></svg>
      <span class="text-[10px] font-medium mt-1">Leagues</span>
    </button>
  </nav>

  <!-- APP INTERACTIVITY LOGIC -->
  <script src="app.js"></script>
</body>
</html>
